services:
  - type: web
    name: ai-interview-gym-micro1-zara
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: LEAD_EXPORT_TOKEN
        sync: false
      - key: GUIDE_ACCESS_SECRET
        sync: false
      - key: OWNER_ACCESS_SECRET
        sync: false
      - key: FIELD_GUIDE_CHECKOUT_URL
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_VARIANT_ID
        sync: false
      - key: PREMIUM_PERSISTENCE_READY
        sync: false
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADSENSE_SLOT_INLINE
        sync: false
      - key: ADSENSE_SLOT_FOOTER
        sync: false
    disk:
      name: lead-and-entitlement-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
